name: Release macOS DMG
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; if (process.env.GITHUB_REF_NAME !== `v${JSON.parse(fs.readFileSync("package.json")).version}`) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package:dmg
      - name: Publish DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "easy text $RELEASE_TAG" --notes-file RELEASE-NOTES.md dist-desktop/*.dmg dist-desktop/*.dmg.sha256
          gh release edit "$RELEASE_TAG" --draft=false --latest
